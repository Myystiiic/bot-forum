
name: Notifications Forumactif Discord

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forumactif-notifications
  cancel-in-progress: false

jobs:
  notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Verifier les notifications
        env:
          DISCORD_WEBHOOK_ADMIN: ${{ secrets.DISCORD_WEBHOOK_ADMIN }}
          DISCORD_WEBHOOK_DEMANDES: ${{ secrets.DISCORD_WEBHOOK_DEMANDES }}
        run: python bot_forum.py
      
      - name: Sauvegarder les notifications traitees
        if: always()
        run: |

          if [ -f notifications_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add notifications_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Sauvegarde des notifications Forumactif"
              git push
            fi
          fi
